# Project identity
rootProjectName = plugins-integration
version = 1.0.0

# Gradle daemon JVM
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Composite build dependencies
includedBuilds = plugins-core,plugins-base,plugins-frontend,plugins-persistence

# Plugin: bundle.ultima-nexus-jvm-application-with-jooq
plugin.bundle.ultima-nexus-jvm-application-with-jooq.displayName = Ultima Nexus - Application with jOOQ and Frontend
plugin.bundle.ultima-nexus-jvm-application-with-jooq.description = Compatibility aggregator applying the Vaadin + htmx frontend bundles and jOOQ codegen from one classloader

# Build performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
