# Project identity
rootProjectName = plugins-frontend
version = 1.0.0

# Gradle daemon JVM
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Composite build dependencies
includedBuilds = plugins-core,plugins-base,plugins-check

# Plugin: feature.vaadin-frontend
plugin.feature.vaadin-frontend.displayName = Ultima Nexus - Vaadin Frontend
plugin.feature.vaadin-frontend.description = Applies the Vaadin plugin, production-mode default, and vaadinBuildFrontend test wiring for any Vaadin web app

# Plugin: feature.spring-vaadin-frontend
plugin.feature.spring-vaadin-frontend.displayName = Ultima Nexus - Spring Vaadin Frontend
plugin.feature.spring-vaadin-frontend.description = Adds the Vaadin Spring Boot integration on top of feature.vaadin-frontend

# Plugin: feature.htmx-frontend
plugin.feature.htmx-frontend.displayName = Ultima Nexus - htmx Frontend
plugin.feature.htmx-frontend.description = Adds the neutral htmx + Thymeleaf server-rendered stack for any JVM web app

# Plugin: feature.spring-htmx-frontend
plugin.feature.spring-htmx-frontend.displayName = Ultima Nexus - Spring htmx Frontend
plugin.feature.spring-htmx-frontend.description = Adds the Spring Boot htmx + Thymeleaf integration on top of feature.htmx-frontend

# Plugin: bundle.ultima-nexus-frontend-vaadin
plugin.bundle.ultima-nexus-frontend-vaadin.displayName = Ultima Nexus - Vaadin Frontend Bundle
plugin.bundle.ultima-nexus-frontend-vaadin.description = Layers the framework's generated Vaadin frontend modules on top of feature.spring-vaadin-frontend

# Plugin: bundle.ultima-nexus-frontend-htmx
plugin.bundle.ultima-nexus-frontend-htmx.displayName = Ultima Nexus - htmx Frontend Bundle
plugin.bundle.ultima-nexus-frontend-htmx.description = Layers the framework's generated htmx frontend modules on top of feature.spring-htmx-frontend

# Build performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
