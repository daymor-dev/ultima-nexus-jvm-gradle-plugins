# Project identity
rootProjectName = plugins-mapper
version = 1.0.0

# Gradle daemon JVM
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Composite build dependencies
includedBuilds = plugins-core,plugins-base

# Plugin: feature.mapstruct
plugin.feature.mapstruct.displayName = Ultima Nexus - MapStruct
plugin.feature.mapstruct.description = MapStruct annotation processor wiring (framework-neutral, lombok-binding aware)

# Plugin: feature.mapstruct-spring
plugin.feature.mapstruct-spring.displayName = Ultima Nexus - MapStruct (Spring)
plugin.feature.mapstruct-spring.description = MapStruct with -Amapstruct.defaultComponentModel=spring overlay

# Build performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
