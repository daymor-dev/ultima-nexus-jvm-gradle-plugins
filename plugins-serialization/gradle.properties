# Project identity
rootProjectName = plugins-serialization
version = 1.0.0

# Gradle daemon JVM
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Composite build dependencies
includedBuilds = plugins-core,plugins-base

# Plugin: feature.dsljson-codegen
plugin.feature.dsljson-codegen.displayName = Ultima Nexus - DSL-JSON codegen
plugin.feature.dsljson-codegen.description = DSL-JSON compile-time converter wiring (reflection-free, -Werror-safe generated marker)

# Build performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
