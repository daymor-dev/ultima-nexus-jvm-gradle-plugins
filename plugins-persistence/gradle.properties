# Project identity
rootProjectName = plugins-persistence
version = 1.0.0

# Gradle daemon JVM
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Composite build dependencies
includedBuilds = plugins-core,plugins-base,plugins-check

# Plugin: feature.jooq-codegen
plugin.feature.jooq-codegen.displayName = Ultima Nexus - jOOQ Codegen
plugin.feature.jooq-codegen.description = Runs jOOQ codegen offline against a directory of SQL DDL, no database or Docker

# Plugin: feature.flyway
plugin.feature.flyway.displayName = Ultima Nexus - Flyway Build-Time Migration
plugin.feature.flyway.description = Wires Flyway build tasks to a configurable migrations directory

# Plugin: feature.liquibase
plugin.feature.liquibase.displayName = Ultima Nexus - Liquibase Build-Time Migration
plugin.feature.liquibase.description = Wires Liquibase build tasks to a configurable changelog file

# Build performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
